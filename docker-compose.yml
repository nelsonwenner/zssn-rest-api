version: "3.7"

services:
    node:
        container_name: "node-container"
        image: node:10.16-slim
        entrypoint: ./.docker/entrypoint.sh
        working_dir: /home/backend
        volumes:
            - ./:/home/backend
        ports: 
            - "8000:8000"
        depends_on: 
            - postgres
        restart: always
        networks:
            - database

    postgres:
        container_name: postgres-container
        image: library/postgres:9.6-alpine
        ports: 
            - "5431:5432"
        volumes: 
            - ./docker/postgres/data:/var/lib/postgresql/data
            - ./.docker/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
        environment:
            - POSTGRES_MULTIPLE_DATABASES=database,test
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=root@123
        restart: always
        networks: 
            - database

    adminer:
        container_name: adminer-container
        image: adminer
        ports:
            - 8080:8080
        restart: always
        networks: 
            - database
 
networks:
  database:
    driver: "bridge"